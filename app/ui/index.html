<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Learner</title>
<link rel="stylesheet" href="vendor/codemirror.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="app-name">Python <span class="hl">Learner</span></div>
      <div class="player-card" id="player-card"></div>
      <div class="overall-progress">
        <div class="progress-track"><div class="progress-fill" id="overall-fill"></div></div>
        <span id="overall-label">0%</span>
      </div>
    </div>
    <nav id="chapter-list"></nav>
    <div class="sidebar-version" id="sidebar-version"></div>
    <button id="sidebar-toggle" class="sidebar-toggle" title="Collapse sidebar">&#171;</button>
  </aside>
  <main id="main">
    <header id="topbar">
      <button id="sidebar-open" class="icon-btn hidden" title="Show sidebar">&#187;</button>
      <div id="breadcrumb" class="breadcrumb"></div>
      <div class="topbar-actions">
        <button id="prev-item" class="icon-btn" title="Previous item (Alt+Left)">&#8592;</button>
        <button id="next-item" class="icon-btn" title="Next item (Alt+Right)">&#8594;</button>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="8" r="3.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M13 3l-1.4 1.4M4.4 11.6L3 13"/>
          </svg>
        </button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="modal-backdrop" class="hidden">
  <div id="modal" class="card">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn">Cancel</button>
      <button id="modal-ok" class="btn btn-primary">OK</button>
    </div>
  </div>
</div>
<div id="whatsnew-backdrop" class="hidden">
  <div id="whatsnew" class="card">
    <h3 id="whatsnew-title"></h3>
    <p id="whatsnew-intro"></p>
    <div class="whatsnew-cols">
      <div class="whatsnew-col">
        <div class="whatsnew-head">Änderungen</div>
        <ul id="whatsnew-changes"></ul>
      </div>
      <div class="whatsnew-col">
        <div class="whatsnew-head">Was ist neu</div>
        <ul id="whatsnew-new"></ul>
      </div>
    </div>
    <p id="whatsnew-outro"></p>
    <div class="modal-actions">
      <button id="whatsnew-reset" class="btn">Progress zurücksetzen</button>
      <button id="whatsnew-ok" class="btn btn-primary">Weiter</button>
    </div>
  </div>
</div>
<script src="vendor/codemirror.min.js"></script>
<script src="vendor/runmode.min.js"></script>
<script src="vendor/python.min.js"></script>
<script src="vendor/closebrackets.min.js"></script>
<script src="vendor/matchbrackets.min.js"></script>
<script src="vendor/active-line.min.js"></script>
<script src="vendor/comment.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
